services:
  api:
    image: ghcr.io/j2st1n/family-plan:latest
    container_name: family-plan-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./dist:/app/static
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://family_plan:family_plan@db:5432/family_plan
      JWT_SECRET: ${JWT_SECRET:-family-plan-dev}

  db:
    image: postgres:16-alpine
    container_name: family-plan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_plan
      POSTGRES_USER: family_plan
      POSTGRES_PASSWORD: family_plan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_plan -d family_plan"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
