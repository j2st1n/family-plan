<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Family Habit Planner" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/icon-32-v1.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/icon-180-v1.png" />
    <link rel="manifest" href="/assets/brand/app-v1.webmanifest" />
    <meta name="description" content="Small steps. Shared growth. 家庭习惯、日常任务与星星奖励。" />
    <title>Family Habit Planner</title>
    <script>
      (function() {
        try {
          var pref = localStorage.getItem("family_plan_theme") || localStorage.getItem("theme") || "auto";
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var effective = pref === "dark" || (pref === "auto" && prefersDark) ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", effective);
          document.documentElement.setAttribute("data-theme-preference", pref);
          if (document.documentElement.style) {
            document.documentElement.style.colorScheme = effective;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
