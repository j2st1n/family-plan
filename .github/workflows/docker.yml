name: Build and Push

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: ghcr.io/j2st1n/family-plan
  CI_IMAGE: family-plan-ci:${{ github.sha }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/parent-web/package-lock.json
            src/child-pwa/package-lock.json
      - name: Parent tests and build
        working-directory: src/parent-web
        run: npm ci && npm test && npm run build
      - name: Child tests and build
        working-directory: src/child-pwa
        run: npm ci && npm test && npm run build
      - name: Shared date, refresh and sharing regressions
        run: |
          node scripts/test-date-input.mjs
          node scripts/test-refresh-queue.mjs
          node scripts/test-task-share-model.mjs
          node scripts/test-child-share-model.mjs
          node scripts/test-task-features.mjs
          bash scripts/test-sync-meiohi.sh

      - name: Browser date and growth-poster regressions
        run: |
          src/child-pwa/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_BROWSER=chromium node scripts/test-integration-browser.mjs
          PLAYWRIGHT_BROWSER=chromium node scripts/test-task-features-browser.mjs
          PLAYWRIGHT_BROWSER=chromium node scripts/test-auth-settings-browser.mjs
          PLAYWRIGHT_BROWSER=chromium node scripts/test-brand-browser.mjs

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.CI_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start services and verify
        env:
          FAMILY_PLAN_IMAGE: ${{ env.CI_IMAGE }}
          JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789
        run: |
          trap 'docker compose down -v' EXIT
          docker compose up -d
          healthy=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/health; then
              healthy=1
              break
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api | tail -50
          test "$healthy" -eq 1
          docker compose exec -T -u root api python -m pip install pytest==9.0.3 httpx==0.28.1
          docker cp src/backend/tests "$(docker compose ps -q api):/tmp/family-plan-tests"
          docker compose exec -T api python -m pytest /tmp/family-plan-tests -q -p no:cacheprovider

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag "${CI_IMAGE}" "${IMAGE_NAME}:latest"
          docker tag "${CI_IMAGE}" "${IMAGE_NAME}:${GITHUB_REF_NAME}"
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${GITHUB_REF_NAME}"
